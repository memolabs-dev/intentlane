schema: "0.1"
app:
  id: "dev.intentlane.example"
  name: "IntentLane Example"
  shortcuts: true
  url_scheme: "intentlaneexample"
  min_ios: "18.0"
  locales: [en, fr]

entities:
  - id: idea
    title:
      en: Idea
      fr: Idée
    identifier: id
    display:
      title: title
      subtitle: status
    query:
      mode: static
    # An idea can be deleted, and this example has a `delete_idea` intent, so an
    # idea that is no longer in the list is item_missing. There is no switch that
    # hides the whole list and no state in which an idea exists but must not be read.
    exposure:
      rules: [item_missing]

intents:
  - id: open_inbox
    title:
      en: Open the inbox
      fr: Ouvrir la boîte de réception
    description:
      en: Show the inbox screen
      fr: Afficher l'écran de réception
    parameters: []
    execution:
      mode: open_app
      route: /inbox

  - id: create_idea
    title:
      en: Create an idea
      fr: Créer une idée
    description:
      en: Add a new idea
      fr: Ajouter une nouvelle idée
    parameters:
      - id: title
        type: string
        required: true
        title:
          en: Idea title
          fr: Titre de l'idée
        prompt:
          en: What is the idea?
          fr: Quelle est l'idée ?
      - id: effort
        type: integer
        required: true
        title:
          en: Effort
          fr: Effort
        prompt:
          en: How much effort?
          fr: Combien d'effort ?
      - id: due
        type: date
        required: false
        title:
          en: Due date
          fr: Échéance
        prompt:
          en: When is it due?
          fr: Pour quand ?
      - id: priority
        type: enum
        required: true
        title:
          en: Priority
          fr: Priorité
        prompt:
          en: Which priority?
          fr: Quelle priorité ?
        values:
          low:
            en: Low
            fr: Basse
          medium:
            en: Medium
            fr: Moyenne
          high:
            en: High
            fr: Haute
    execution:
      mode: open_app
      route: /ideas/new
      mapping:
        title: title
        effort: effort
        due: due
        priority: priority
    risk:
      level: write
      confirmation: optional
      authentication: inherited
    result:
      dialog:
        en: Your idea is ready
        fr: Votre idée est prête
    shortcuts:
      phrases:
        en:
          - Create an idea in ${appName}
        fr:
          - Créer une idée dans ${appName}

  - id: open_idea
    title:
      en: Open an idea
      fr: Ouvrir une idée
    description:
      en: Open a saved idea
      fr: Ouvrir une idée enregistrée
    parameters:
      - id: idea
        type: entity
        entity: idea
        required: true
        title:
          en: Idea
          fr: Idée
        prompt:
          en: Which idea?
          fr: Quelle idée ?
    execution:
      mode: open_app
      route: /ideas
      mapping:
        idea: idea
    shortcuts:
      phrases:
        en:
          - Open an idea in ${appName}
        fr:
          - Ouvrir une idée dans ${appName}

  - id: delete_idea
    title:
      en: Delete an idea
      fr: Supprimer une idée
    description:
      en: Delete a saved idea
      fr: Supprimer une idée enregistrée
    parameters:
      - id: idea
        type: entity
        entity: idea
        required: true
        title:
          en: Idea
          fr: Idée
        prompt:
          en: Which idea?
          fr: Quelle idée ?
    execution:
      mode: open_app
      route: /ideas/delete
      mapping:
        idea: idea
    risk:
      level: destructive
      confirmation: always
      authentication: required
      confirmation_prompt:
        en: Delete this idea?
        fr: Supprimer cette idée ?
    result:
      dialog:
        en: The idea is deleted
        fr: "L'idée est supprimée"
    shortcuts:
      phrases:
        en:
          - Delete an idea in ${appName}
        fr:
          - Supprimer une idée dans ${appName}
