name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, tests and generated output
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm build
      - name: Run the test suite
        run: pnpm test
      - name: Validate the reference contract
        run: pnpm validate
      - name: Generate the reference artifacts
        run: pnpm exec tsx packages/cli/src/index.ts generate --output .intentlane/generated
      - name: Fail when the generated artifacts are stale
        run: pnpm exec tsx packages/cli/src/index.ts generate --output .intentlane/generated --check
      - name: Generate twice and compare the output
        run: |
          pnpm exec tsx packages/cli/src/index.ts generate --output /tmp/intentlane-second
          diff -r .intentlane/generated /tmp/intentlane-second

  swift:
    name: Compile the generated Swift (${{ matrix.image }})
    runs-on: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: [macos-15, macos-26]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Report the toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Generate the reference artifacts
        run: pnpm exec tsx packages/cli/src/index.ts generate --output .intentlane/generated
      - name: Generate the example artifacts
        run: pnpm exec tsx packages/cli/src/index.ts generate --config apps/example-expo/intentlane.yaml --output /tmp/intentlane-example
      - name: Compile the generated Swift for the simulator
        run: |
          xcrun --sdk iphonesimulator swiftc -c -target arm64-apple-ios18.0-simulator .intentlane/generated/IntentLaneGenerated.swift -o /tmp/reference.o
          xcrun --sdk iphonesimulator swiftc -c -target arm64-apple-ios18.0-simulator /tmp/intentlane-example/IntentLaneGenerated.swift -o /tmp/example.o
          ls -l /tmp/reference.o /tmp/example.o

  macos:
    name: Extract the App Intents metadata for macOS
    runs-on: xcode-27
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Report the toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Verify the macOS example
        run: node apps/example-macos/verify.mjs
      - name: Audit the macOS fixtures
        run: |
          pnpm exec tsx packages/cli/src/index.ts audit apps/example-macos/build/shelf --platform macos --format json --output /tmp/intentlane-shelf.json
          pnpm exec tsx packages/cli/src/index.ts audit apps/example-macos/build/studio --platform macos --sdk-path "$(xcrun --sdk macosx --show-sdk-path)" --build-metadata apps/example-macos/build/studio/metadata/Metadata.appintents --format json --output /tmp/intentlane-studio.json
          pnpm exec tsx packages/cli/src/index.ts audit apps/example-macos/build/studio --platform both --format json --output /tmp/intentlane-both.json
          pnpm exec tsx packages/cli/src/index.ts audit apps/example-macos/build/reader --platform macos --format json --output /tmp/intentlane-reader.json
          python3 - <<'PY'
          import json

          def read(path):
              report = json.loads(open(path).read())
              return report, {finding["capability"]: finding["state"] for finding in report["findings"]}

          shelf_report, shelf = read("/tmp/intentlane-shelf.json")
          report, studio = read("/tmp/intentlane-studio.json")
          reader_report, reader = read("/tmp/intentlane-reader.json")

          assert report["sdk"]["version"], report.get("sdk")
          assert shelf_report["score"]["discovery"] == "shortcuts-only", shelf_report["score"]
          assert report["score"]["discovery"] == "schema-backed", report["score"]
          assert reader["semantics.shortcuts-only-schema"] == "implemented", reader["semantics.shortcuts-only-schema"]
          assert reader["semantics.schema-completeness"] == "unknown", reader["semantics.schema-completeness"]
          assert reader_report["score"]["discovery"] == "shortcuts-only", reader_report["score"]
          assert report["route"]["route"] == "native", report["route"]
          assert shelf_report["route"]["route"] == "native", shelf_report["route"]
          assert report["data"]["privacy"] == "unknown", report["data"]
          assert shelf_report["data"]["privacy"] == "unknown", shelf_report["data"]
          assert report["data"]["indexed"] is False, report["data"]
          assert report["architecture"]["architecture"] == "unknown", report["architecture"]
          assert shelf_report["architecture"]["architecture"] == "unknown", shelf_report["architecture"]
          assert any(condition["name"] == "operatingSystem" and condition["state"] == "recorded" for condition in report["conditions"]["conditions"]), report["conditions"]
          assert any(condition["name"] == "xcode" and condition["state"] == "recorded" for condition in report["conditions"]["conditions"]), report["conditions"]
          assert report["conditions"]["nextAction"], report["conditions"]
          assert report["quality"]["signals"], report["quality"]
          assert report["quality"]["issues"] == [], report["quality"]
          assert report["catalogue"]["state"] == "current", report["catalogue"]
          assert shelf["foundation.app-intent"] == "implemented", shelf["foundation.app-intent"]
          assert shelf["semantics.app-schema"] == "unknown", shelf["semantics.app-schema"]
          assert shelf["proof.siri-surface"] == "unknown", shelf["proof.siri-surface"]
          assert studio["semantics.app-schema"] == "tested", studio["semantics.app-schema"]
          assert studio["proof.siri-surface"] == "detected", studio["proof.siri-surface"]
          assert studio["execution.live-activity"] == "unsupported", studio["execution.live-activity"]

          print("sdk:", report["sdk"])
          print("score:", report["score"])
          print("route:", report["route"]["route"], shelf_report["route"]["route"])
          print("data:", report["data"]["classes"], report["data"]["privacy"])
          print("architecture:", report["architecture"]["architecture"], shelf_report["architecture"]["architecture"])
          print("conditions:", [(condition["name"], condition["state"]) for condition in report["conditions"]["conditions"]])
          print("quality:", report["quality"]["signals"], report["quality"]["issues"])
          print("catalogue:", report["catalogue"]["version"], report["catalogue"]["state"])
          both = json.loads(open("/tmp/intentlane-both.json").read())["reports"]
          assert [entry["target"]["platform"] for entry in both] == ["macos", "ios"], both
          assert all(entry["score"]["discovery"] == "schema-backed" for entry in both), both
          print("both:", [entry["target"]["platform"] for entry in both])
          print("shelf:", {key: value for key, value in sorted(shelf.items()) if value != "unknown"})
          print("studio:", {key: value for key, value in sorted(studio.items()) if value != "unknown"})
          PY
      - name: Guard the reader fixture against audit regressions
        run: pnpm exec tsx packages/cli/src/index.ts audit-diff apps/example-macos/baseline/reader-macos.json /tmp/intentlane-reader.json --fail-on regression --format text

  simulator:
    name: Build the example app for the simulator
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Report the toolchain
        run: |
          xcodebuild -version
          pod --version
      - name: Build the CLI bundle
        run: pnpm bundle
      - name: Generate the iOS project and build the app
        working-directory: apps/example-expo
        env:
          NODE_ENV: production
        run: |
          pnpm exec expo prebuild --platform ios
          cd ios
          xcodebuild -workspace IntentLaneExample.xcworkspace -scheme IntentLaneExample -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Assert the App Intents metadata and the strings table
        working-directory: apps/example-expo
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import plistlib

          app = pathlib.Path("ios/build/Build/Products/Release-iphonesimulator/IntentLaneExample.app")
          metadata = json.loads((app / "Metadata.appintents/extract.actionsdata").read_text())
          actions = metadata["actions"]

          expected = {"CreateIdea", "DeleteIdea", "OpenIdea", "OpenInbox"}
          missing = expected - set(actions)
          assert not missing, f"missing actions: {sorted(missing)}"

          flags = {name: action["outputFlags"] for name, action in actions.items()}
          assert set(flags.values()) == {7}, flags

          delete = actions["DeleteIdea"]
          assert delete["authenticationPolicy"] == 1, delete["authenticationPolicy"]
          assert delete["isAuthPolExplicit"] is True

          titles = {parameter["name"]: parameter["title"]["key"] for parameter in delete["parameters"]}
          assert titles == {"idea": "Idea"}, titles

          assert "IntentLaneIdeaEntity" in metadata["entities"]
          assert "IntentLaneIdeaQuery" in metadata["queries"]

          shortcuts = {shortcut["actionIdentifier"] for shortcut in metadata["autoShortcuts"]}
          assert {"CreateIdea", "DeleteIdea", "OpenIdea"} <= shortcuts, sorted(shortcuts)

          strings = plistlib.loads((app / "fr.lproj/IntentLane.strings").read_bytes())
          assert strings["Delete this idea?"] == "Supprimer cette idée ?", strings["Delete this idea?"]
          assert strings["Idea title"] == "Titre de l'idée", strings["Idea title"]

          print("actions:", sorted(actions))
          print("output flags:", flags)
          print("strings table entries:", len(strings))
          PY
